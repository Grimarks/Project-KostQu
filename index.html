<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>KostQu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!--Navbar Normal-->
<header id="ContainerNav">
    <nav class="nav-container">
        <div id="logo">
            <a href="index.html"><img src="foto/LOGO.png" alt="Logo KostQu" ></a>
        </div>

        <div id="SearchBar">
            <input type="text" id="search-bar" placeholder="Search...">
            <button id="search-button">Search</button>
        </div>

        <div id="Navi" class="nav-links">
            <a><img src="foto/notifB.png" alt="Notification icon" width="25px"></a>
            <a><img src="foto/infoB.png" alt="Information icon" width="25px"></a>
        </div>

        <div id="Akun">
            <img src="foto/akunB.png" alt="Account icon" width="40px">
            <span id="akun-name">Hakan Ilyasa</span>
        </div>
    </nav>
</header>

<!--Navbar Hamburger untuk hp-->
<nav id="navbar">
    <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <div id="SearchBarHam">
        <input type="text" id="search-barHam" placeholder="Search...">
        <button id="search-barHam-button">Search</button>
    </div>

    <div id="fotoLogo">
        <img src="foto/LOGO.png" alt="logo KostQu" height="60px" onclick="window.location.href='index.html'">
    </div>

    <div class="offScreenMenu" id="offScreenMenu">
        <ul>
            <div id="hamLi">
                <li><a href="index.html">Home</a></li>
                <li><a href="">Notification</a></li>
                <li><a href="">Information</a></li>
            </div>
        </ul>
    </div>
</nav>

<div class="slider">
    <div class="slides">
        <img class="slide" src="foto/Kost1.jpeg" alt="Image #1">
        <img class="slide" src="foto/Kost2.jpeg" alt="Image #2">
        <img class="slide" src="foto/Kost3.jpeg" alt="Image #3">
        <img class="slide" src="foto/Kost4.jpeg" alt="Image #4">
    </div>
    <button class="prev" onclick="prevSlide()">&#10094</button>
    <button class="next" onclick="nextSlide()">&#10095</button>
</div>

<div id="content">
<!--    isi konten akan disini-->
</div>

<script src="index.js"></script>
<script>
    // URL API untuk mendapatkan daftar kost
    const apiUrl = 'http://localhost:3001/kosts';

    // Fungsi untuk memuat data kost
    async function fetchKostList() {
        try {
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error(`Error: ${response.statusText}`);

            const kosts = await response.json(); // Data dari API
            const contentDiv = document.getElementById('content');

            // Kosongkan isi div sebelum menambahkan data baru
            contentDiv.innerHTML = '';

            // Loop melalui setiap kost dan buat elemen HTML
            kosts.forEach(kost => {
                const kostContainer = document.createElement('div');
                kostContainer.className = 'container';

                // Tambahkan gambar, nama kost, lokasi, dan kontak
                kostContainer.innerHTML = `
                <div id="ContainerKost" class="container">
                     <a href="deskripsiKost.html?id=${kost.id_kost}">
                    <img src="FotoKost/${kost.foto_utama}" alt="${kost.nama_kost}">
                    </a>
                    <p>${kost.nama_kost}</p>
                    <p>Lokasi: ${kost.alamat_jalan}</p>
                    <p>No kontak: ${kost.no_hp}</p>

                    <!-- Overlay opsional -->
                    <div class="overlay">
                        <p>${kost.nama_kost}</p>
                        <p>Hubungi: ${kost.no_hp}</p>
                        <a href="deskripsiKost.html?id=${kost.id_kost}">Lihat Detail</a>
                    </div>
                </div>
                `;

                // Tambahkan elemen ke dalam div utama
                contentDiv.appendChild(kostContainer);
            });
        } catch (error) {
            console.error('Error fetching kost data:', error);
            alert('Gagal memuat data kost dari server.');
        }
    }

    // Panggil fungsi saat halaman dimuat
    document.addEventListener('DOMContentLoaded', fetchKostList);

    //untuk nyari kost
    async function searchKost() {
        // Ambil input pencarian dari kedua navbar
        const searchInput = document.getElementById('search-bar').value.trim(); // navbar desktop
        const searchInputHam = document.getElementById('search-barHam').value.trim(); // navbar mobile

        // Tentukan mana input yang digunakan
        const query = searchInput || searchInputHam; // Gunakan salah satu yang tidak kosong

        if (!query) {
            // Jika kedua input kosong, muat ulang daftar kost
            fetchKostList();
            return;
        }

        console.log('Searching for:', query); // Debug untuk input pencarian

        const apiUrl = `http://localhost:3001/kosts?search=${encodeURIComponent(query)}`;

        try {
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error(`Error: ${response.statusText}`);

            const kosts = await response.json();
            const contentDiv = document.getElementById('content');
            contentDiv.innerHTML = ''; // Kosongkan konten sebelumnya

            // Jika tidak ada hasil
            if (kosts.length === 0) {
                contentDiv.innerHTML = `<p>Hasil pencarian untuk "${query}" tidak ditemukan.</p>`;
                return;
            }

            // Tampilkan hasil pencarian
            kosts.forEach(kost => {
                const kostContainer = document.createElement('div');
                kostContainer.className = 'container';
                kostContainer.innerHTML = `
                <div id="ContainerKost" class="container">
                    <a href="deskripsiKost.html?id=${kost.id_kost}">
                        <img src="FotoKost/${kost.foto_utama}" alt="${kost.nama_kost}">
                    </a>
                    <p>${kost.nama_kost}</p>
                    <p>Lokasi: ${kost.alamat_jalan}</p>
                    <p>No kontak: ${kost.no_hp}</p>

                    <div class="overlay">
                        <p>${kost.nama_kost}</p>
                        <p>Hubungi: ${kost.no_hp}</p>
                        <a href="deskripsiKost.html?id=${kost.id_kost}">Lihat Detail</a>
                    </div>
                </div>
            `;
                contentDiv.appendChild(kostContainer);
            });
        } catch (error) {
            console.error('Error searching kost:', error);
            alert('Gagal mencari data kost.');
        }
    }

    // Event listener untuk tombol search desktop
    document.getElementById('search-button').addEventListener('click', searchKost);

    // Event listener untuk tombol search mobile
    document.getElementById('search-barHam-button').addEventListener('click', searchKost);

</script>

</body>
</html>
